name: Apply

# Applies dev after a merge to main, as the deploy account. The GitHub
# environment "dev" can require a reviewer before this job starts.
on:
  push:
    branches: [main]
    paths: ["envs/dev/**", "modules/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_github_repository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - run: terraform -chdir=envs/dev init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=envs/dev apply -input=false -auto-approve
